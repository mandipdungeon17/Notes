commonLabels:
  chart-by: bitnami
  env: dev
replicaCount: 2
podLabels:
  name: apache
  managed-by: helm
  version: "11.4.29"
  component: frontend
  part-of: employee
resources:
  limits:
    cpu: 100m
    memory: 100Mi
  requests:
    cpu: 50m
    memory: 50Mi
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 50
  targetMemory: 50
service:
  type: ClusterIP
