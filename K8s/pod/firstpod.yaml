apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: dev
  labels:
    name: nginxlabel
    client: abc
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dbapp
  namespace: dev
spec:
  containers:
  - name: boxone
    image: redis
---
apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: test
spec:
  containers:
  - name: boxone
    image: nginx:1.14.2
    ports:
    - containerPort: 80
  - name: boxtwo
    image: redis
---
apiVersion: v1
kind: Pod
metadata:
  name: multi2
  namespace: prod
spec:
  containers:
  - name: boxone
