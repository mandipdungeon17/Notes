apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: dev
spec:
  limits:
  - default: # this section defines default limits
      cpu: 200m
      memory: 200Mi
    defaultRequest: # this section defines default requests
      cpu: 51m
      memory: 51Mi
    max: # max and min define the limit range
      cpu: 400m
      memory: 400Mi
    min:
      cpu: 50m
      memory: 50Mi
    type: Container

