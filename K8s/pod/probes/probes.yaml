apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbapp
  annotations:
    kubernetes.io/change-cause: "Checking Starter Probe"
spec:
  replicas: 3
  selector:
     matchLabels:
        app: dbapp
  template:
    metadata:
      labels:
        app: dbapp
    spec:
      containers:
      - name: nginx
        image: lovelearnlinux/webserver:v1
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 100Mi
        startupProbe:
          exec:
            command:
            - cat
            - /var/www/html/index.html
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - cat
            - /var/www/html/index.html
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          exec:
            command:
            - cat
            - /var/www/html/index.html
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 4
          successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: dbapp-svc
spec:
  selector:
    app: dbapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

